# -----------------------------------------------------------------------------
# platform.yaml - the one file you edit first.
# Everything else in the repo derives names, regions and environments from here.
# -----------------------------------------------------------------------------
prefix: piq                     # short org mnemonic, lowercase, 2-5 chars
unique_suffix: a1b2             # 3-6 lowercase alphanumerics; makes storage/key vault names globally unique

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"        # az account show --query tenantId -o tsv
  subscription_id: "00000000-0000-0000-0000-000000000000"  # az account show --query id -o tsv
  location: eastus2             # pick the Azure region closest to you that supports Databricks serverless

databricks:
  # Filled in during RUNBOOK Phase 4, after the first workspace exists.
  account_id: "00000000-0000-0000-0000-000000000000"
  account_host: https://accounts.azuredatabricks.net

# Terraform remote state, created by bootstrap/. Names must match bootstrap outputs.
state:
  resource_group: rg-piq-tfstate
  storage_account: stpiqtfstatea1b2      # 3-24 lowercase alphanumerics, globally unique
  container: tfstate

github:
  org: your-github-org
  platform_repo: piq-databricks-platform

notifications:
  ops_email: platform-ops@example.com

environments:
  dev:
    network:
      vnet_cidr: 10.10.0.0/20
      host_subnet_cidr: 10.10.0.0/22        # "public" subnet in Azure Databricks terms
      container_subnet_cidr: 10.10.4.0/22   # "private" subnet in Azure Databricks terms
      nat_gateway: false                     # true = classic clusters get internet egress (~USD 32/month)
    storage_replication: LRS
    ip_access_list: []                       # CIDRs allowed to reach the workspace; empty = not enforced
    serverless_egress:
      restriction_mode: FULL_ACCESS          # FULL_ACCESS | RESTRICTED_ACCESS
      enforcement_mode: DRY_RUN              # DRY_RUN logs violations, ENFORCED blocks them
      allowed_domains: []
  prd:
    network:
      vnet_cidr: 10.20.0.0/20
      host_subnet_cidr: 10.20.0.0/22
      container_subnet_cidr: 10.20.4.0/22
      nat_gateway: false
    storage_replication: ZRS
    ip_access_list: []
    serverless_egress:
      restriction_mode: RESTRICTED_ACCESS
      enforcement_mode: DRY_RUN              # switch to ENFORCED after reviewing denied-egress logs
      allowed_domains:
        - api.github.com
        - pypi.org
        - files.pythonhosted.org
