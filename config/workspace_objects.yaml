# -----------------------------------------------------------------------------
# workspace_objects.yaml - permissions on WORKSPACE objects (not Unity Catalog).
# SQL warehouses, cluster policies and vector search endpoints have their own
# ACLs; a SELECT grant on a table does not let anyone use a warehouse.
# Values are lists of roles; "sandbox" = the sandbox users group (dev only).
# -----------------------------------------------------------------------------
sql_warehouses:
  etl:
    size: 2X-Small
    max_clusters: 1
    auto_stop_mins: 10
    CAN_USE: [producer]
    CAN_MANAGE: [admin, dbadmin]
  bi:
    size: 2X-Small
    max_clusters: 2
    auto_stop_mins: 10
    CAN_USE: [consumer, analyst, ai, sandbox]
    CAN_MANAGE: [admin, dbadmin]

cluster_policies:
  job-compute:
    description: Classic job clusters for workloads serverless cannot run
    CAN_USE: [producer, admin, dbadmin]
    max_workers: 4
    autotermination_minutes: 0         # 0 = not set; job clusters terminate with the job
    dev_only: false
  shared-compute:
    description: Standard-access-mode interactive clusters (dev experimentation)
    CAN_USE: [producer, analyst, ai, admin, dbadmin, sandbox]
    max_workers: 2
    autotermination_minutes: 30
    dev_only: true

vector_search:
  enabled: true
  CAN_USE: [producer, ai]
  CAN_MANAGE: [admin, dbadmin]
