# -----------------------------------------------------------------------------
# entitlements/dev/admins.yaml - domain database admins
# ENTITLEMENTS: who is in which group and which access requests were approved, in dev only.
# This folder is the stand-in for an identity-governance tool (SailPoint, Saviynt, ...). Only
# stacks/25-access reads it. Everything else in the repo defines the groups and what they may do.
# When an IAM tool takes over, delete this folder and stack 25; the group NAMES are the contract.
# -----------------------------------------------------------------------------
# <domain>: [upn, ...]   members of piq-<env>-<domain>-dbadmin
domains: {}
