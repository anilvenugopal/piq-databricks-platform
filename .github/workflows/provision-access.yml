# Access-portal provisioning. An approved access-request issue becomes a pull
# request; CODEOWNERS routes it to the right approver (producing domain for
# product access, governance for SARs, platform for personas and sandboxes).
# The portal Worker writes a JSON block into the issue body, for example:
#   <!-- piq-access {"type":"product","name":"loss_ratio","consumer":"exec_reporting"} -->
#   <!-- piq-access {"type":"persona","upn":"jane@corp.com","name":"data-analyst"} -->
#   <!-- piq-access {"type":"sandbox","upn":"jane@corp.com"} -->
#   <!-- piq-access {"type":"sar","name":"financial_metrics","env":"prd","group":"consumer:exec_reporting:analyst"} -->
name: provision-access

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  to-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'access-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Edit config
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          json=$(printf '%s' "$BODY" | sed -n 's/.*<!-- piq-access \(.*\) -->.*/\1/p' | head -1)
          [ -n "$json" ] || { echo "No piq-access block in issue body"; exit 1; }
          args="$(echo "$json" | jq -r '.type')"
          for k in upn name consumer env group; do
            v=$(echo "$json" | jq -r --arg k "$k" '.[$k] // empty')
            [ -n "$v" ] && args="$args --$k $v"
          done
          python3 scripts/provision_access.py $args --issue "$ISSUE"
          python3 scripts/validate_config.py
          echo "SUMMARY=$(echo "$json" | jq -c .)" >> "$GITHUB_ENV"
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: access/issue-${{ github.event.issue.number }}
          title: "Access request #${{ github.event.issue.number }}"
          body: |
            Closes #${{ github.event.issue.number }}.
            Request: `${{ env.SUMMARY }}`
            After merge, apply the stacks listed in docs/OPERATIONS.md for this request type.
          commit-message: "access: issue #${{ github.event.issue.number }}"
