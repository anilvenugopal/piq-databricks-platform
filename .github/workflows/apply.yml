# Applies ONE stack, on demand, after a human approves the "platform" environment.
# Stacks are applied in order 10 -> 70; the runbook explains when to re-run which.
name: apply

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        required: true
        type: choice
        options: [10-foundation, 20-identity, 30-account, 40-unity-catalog, 50-workspace, 55-ai-platform, 60-governance, 70-observability]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply      # never two applies at once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: platform      # required reviewer gate; OIDC subject environment:platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply ${{ inputs.stack }}
        run: |
          python3 scripts/validate_config.py
          ./scripts/tf.sh ${{ inputs.stack }} init -input=false
          ./scripts/tf.sh ${{ inputs.stack }} plan -input=false -out tfplan
          ./scripts/tf.sh ${{ inputs.stack }} apply -input=false tfplan
