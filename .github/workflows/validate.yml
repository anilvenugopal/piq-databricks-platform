# Runs on every pull request: no cloud credentials needed.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Config rules
        run: python3 scripts/validate_config.py
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - name: Format
        run: terraform fmt -recursive -check
      - name: Naming module tests
        run: python3 tests/naming/run_tests.py
      - name: Deployment wrapper tests
        run: python3 tests/wrappers/run_tests.py
      - name: Mocked plan of every stack
        run: python3 tests/stacks/run_plan_tests.py
      - name: Validate every stack
        run: |
          for d in bootstrap stacks/*/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
